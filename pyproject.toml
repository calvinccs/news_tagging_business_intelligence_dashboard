[project]
name = "news-tagging-business-intelligence-dashboard"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "calvinccs", email = "thisiscalvinccs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
news-tagging-business-intelligence-dashboard = "news_tagging_business_intelligence_dashboard:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
